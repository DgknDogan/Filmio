name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# A new push to the same branch makes the run in flight pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned rather than "stable": a toolchain that moves on its own turns an
  # unrelated push into a red build.
  FLUTTER_VERSION: "3.44.4"

  # Same reasoning, and App Store Connect makes it sharper: it rejects any
  # upload built against an SDK older than iOS 26, and the macOS runner image
  # still selects Xcode 16.4 by default. This is the version installed on the
  # image that matches the one used locally.
  XCODE_VERSION: "26.2"

jobs:
  verify:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      # Generated files keep the generator's own formatting. Reformatting them
      # would make every regeneration churn, and the check below would fail on
      # a diff nobody wrote.
      - name: Format
        run: |
          dart format --output=none --set-exit-if-changed \
            $(git ls-files '*.dart' | grep -vE '\.(g|gr|gen)\.dart$|app_localizations')

      - name: Analyze
        run: flutter analyze

      # No env.json here on purpose: a unit or widget test that needs the TMDB
      # token is a test that reaches the network, and none of them should.
      - name: Test
        run: flutter test

      # Generated code is committed, so it can go stale. This is the only thing
      # that catches an annotated source or an .arb edited without a
      # regeneration.
      #
      # A checkout has no build cache, so this always regenerates from scratch.
      # Reproducing a failure locally needs `dart run build_runner clean` first:
      # with a warm cache build_runner writes nothing and a stale file looks
      # current.
      #
      # build_runner formats what it writes at dart_style's default 80 columns
      # and ignores the `formatter: page_width: 150` in analysis_options.yaml,
      # so the files it emits are not the files `dart format` produces. The
      # committed copies are the formatted ones; reformatting here is what
      # keeps this step comparing content instead of column widths.
      - name: Generated code is current
        run: |
          dart run build_runner build
          flutter gen-l10n
          dart format \
            $(git ls-files '*.dart' | grep -E '\.(g|gr|gen)\.dart$|app_localizations')
          git diff --exit-code

  ios:
    name: iOS TestFlight
    needs: verify
    if: github.event_name == 'push'
    # macOS is the only runner that can build for iOS, and on a private
    # repository it bills at ten times the Linux rate. That is the reason this
    # job runs on a push to master and never on a pull request.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Without this the whole job runs on the image's default Xcode 16.4,
      # which builds against the iOS 18.5 SDK. Everything up to and including
      # the export succeeds; the upload is what fails, at the very end of the
      # longest job in the pipeline, with `SDK version issue. This app was
      # built with the iOS 18.5 SDK`. Selecting the toolchain first is what
      # keeps that failure from being discovered forty minutes in.
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app
          xcodebuild -version

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      # Same as the Android leg: env.json is gitignored and written here from
      # the repository secret. Without TMDB_TOKEN the app throws on launch, so
      # a build that skipped this would reach TestFlight and crash on open.
      #
      # `FLAVOR` is load-bearing here in a way it is not on Android. iOS has
      # no Xcode scheme named after a flavor yet, so `--flavor` cannot be
      # passed — `AppFlavor.resolve` has nothing but this define to go on, and
      # without it the build resolves to dev, where there is no generated
      # options file. That build reaches TestFlight and throws on launch.
      - name: Write env.json
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: |
          cat > env.json <<JSON
          {"TMDB_TOKEN": "$TMDB_TOKEN", "FLAVOR": "prod", "USE_FIREBASE_EMULATOR": false}
          JSON

      # Skipped until the App Store Connect key exists, so the pipeline stays
      # green from the first run and gains the TestFlight leg the moment the
      # three secrets are added.
      - name: Is the App Store Connect key set?
        id: appstore
        env:
          KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::APPSTORE_PRIVATE_KEY is not set — nothing was sent to TestFlight."
          fi

      # The key authenticates three separate things: creating the signing
      # certificate, downloading the provisioning profile, and the upload. It
      # is the reason no .p12 has to be exported from a Mac and kept as a
      # secret. altool reads it from this exact path, by key id.
      - name: Install the App Store Connect key
        if: steps.appstore.outputs.ready == 'true'
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8

      # Compiles the Dart and writes the dart-defines into Generated.xcconfig,
      # which is what the Xcode build phase below reads. Archiving straight
      # from Xcode without this step is how a build reaches TestFlight with an
      # empty TMDB_TOKEN.
      #
      # The build number is the run number: TestFlight rejects a second upload
      # carrying a build number it has already seen, and pubspec's `+1` would
      # only ever work once.
      #
      # The version *name* is not overridden — it is whatever is left of
      # pubspec's `version:`, and it has to be bumped past the last version
      # released on the App Store before a push to master can reach
      # TestFlight. A marketing version that is already out closes its own
      # train, and the upload is refused with `Invalid Pre-Release Train. The
      # train version '<x.y.z>' is closed for new build submissions`. Nothing
      # earlier in this job can see that coming: the archive and the export
      # succeed, and it fails at the last step of the longest job.
      - name: Compile
        if: steps.appstore.outputs.ready == 'true'
        run: |
          flutter build ios \
            --release \
            --no-codesign \
            --build-number=${{ github.run_number }} \
            --dart-define-from-file=env.json

      # `-destination generic/platform=iOS` is load-bearing. Without it
      # xcodebuild resolves a concrete destination, which on CI is the runner
      # machine itself; signing then tries to put that machine into the
      # provisioning profile and fails with `Device "sjc20-cw711-..." isn't
      # registered in your developer account`, followed by `No profiles for
      # 'com.dogukan.filmio' were found`. A generic destination has no device to
      # register, so automatic signing can mint the profile through the API key.
      #
      # Nothing else belongs on this command line. Two things go wrong if you
      # push signing settings here:
      #
      #   - `CODE_SIGN_IDENTITY=Apple Distribution` contradicts automatic
      #     signing, which archives for development by design, and Xcode stops
      #     with `Runner has conflicting provisioning settings`. The archive is
      #     *meant* to be development-signed; the export step below is what
      #     re-signs it for the App Store, exactly as Xcode's Organizer does.
      #
      #   - Command-line build settings apply to every target in the workspace,
      #     including the SPM packages under Flutter's ephemeral Packages
      #     directory and the Firebase checkouts. Those have no DEVELOPMENT_TEAM
      #     of their own, so `CODE_SIGN_STYLE=Automatic` makes each of them fail
      #     with `Signing for "Firebase_FirebaseAuth" requires a development
      #     team` — around thirty targets at once.
      - name: Archive
        if: steps.appstore.outputs.ready == 'true'
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Export the ipa
        if: steps.appstore.outputs.ready == 'true'
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/ipa" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      # Uploading is what puts the build in TestFlight. Processing takes a few
      # minutes after this step goes green, and the build appears in App Store
      # Connect on its own.
      #
      # altool's exit code cannot be trusted on its own: a rejected upload has
      # come back as a success here, which is how a green run left nothing in
      # TestFlight. So its output is kept and read, and the step fails on
      # altool's own error markers rather than on its status alone.
      - name: Upload to TestFlight
        if: steps.appstore.outputs.ready == 'true'
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -o pipefail
          xcrun altool --upload-app \
            --type ios \
            --file "$RUNNER_TEMP"/ipa/*.ipa \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/altool.log"

          if grep -qE 'ERROR: \[altool|Failed to upload package' "$RUNNER_TEMP/altool.log"; then
            echo "::error::altool reported an error, so nothing reached TestFlight. See the log above."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: steps.appstore.outputs.ready == 'true'
        with:
          name: filmio-ipa
          path: ${{ runner.temp }}/ipa/*.ipa
          retention-days: 14

